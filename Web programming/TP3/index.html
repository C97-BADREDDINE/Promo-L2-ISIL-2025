<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500&display=swap" rel="stylesheet" />
    <title>Fiche de vœux </title>
    <style>
        * {
            box-sizing: border-box;
            font-family: "Poppins", sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            color: navy;
            background-color: #f2f2f2;
        }

        table {
            border-collapse: collapse;
            width: 100%;
        }


        td {
            display: inline-block;
        }

        th {
            background-color: #f2f2f2;
        }

        #TableExt {
            width: 800px;
            margin: 0 auto;
            border: 3px solid black;
            padding: 0;
        }

        #TableExt td,
        tr {
            display: block;
            width: 800px;
            border: none;
        }

        #TableInt {
            display: block;
            width: 100%;
            border: none;
            padding: 0;
            background-color: #ed9a461c;
        }

        TableInt tr {
            display: block;
            border: none;
            padding: 0;
            width: 100%;
        }

        #TableInt td {
            display: inline-block;
            width: 100%;
            margin: 5px;
            margin-bottom: 13px;
            font-size: 18px;
        }

        #TableInt .cellule1 {
            width: 40%;
            text-align: right;
        }

        #TableInt .cellule2 {
            width: 10%;
        }

        #TableInt .cellule3 {
            width: 40%;
        }

        input[type="text"],
        textarea {
            width: 100%;
            padding: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        input[type="number"] {
            width: 100%;
            padding: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        input[type="date"] {
            width: 100%;
            padding: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            text-align: center;
        }

        input[type="radio"] {
            margin: 5px;
        }

        input[type="checkbox"] {
            margin: 5px;
        }

        input[type="file"] {
            display: none;
        }

        select {
            width: 100%;
            padding: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

       
        textarea {
            height: 100px;
        }

        #fusionnée {
            display: block;
            width: 100%;
            border: none;
        }

        #fusionnée td {
            display: inline-block;
            width: 100%;
            margin: 5px;
            font-size: 18px;
            border: none;
        }

        #fusionnée td {
            text-align: center;
        }

        #fusionnée input[type="submit"] {
            width: 40%;
            padding: 10px;
            border: none;
            background-color: orange;
            color: white;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
        }

        #fusionnée input[type="submit"]:hover {
            background-color: darkorange;
        }

        #fusionnée input[type="reset"] {
            width: 40%;
            padding: 10px;
            border: none;
            background-color: #f2f2f2;
            color: black;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
        }

        #fusionnée input[type="reset"]:hover {
            background-color: #e2e2e2;
        }

        .lbl {
            width: 100%;
            position: relative;
            overflow: hidden;
            display: inline-block;
            text-align: center;
            padding: 10px 15px;
            border: 1px solid #3498db;
            border-radius: 4px;
            background-color: #3498db;
            color: #fff;
            user-select: none;
            font-weight: bold;
            cursor: pointer;
        }

        .lbl:hover {
            background-color: #2980b9;
        }

        .lbl:active {
            background-color: #2980b9;
        }

        .upl {
            position: absolute;
            top: 0;
            right: 0;
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
            opacity: 0;
            filter: alpha(opacity=0);
        }

        .upl:hover {
            background-color: #2980b9;
        }

        .upl:active {
            background-color: #2980b9;
            transform: scale(0.9);
        }

        .upl:after {
            content: 'Choisir un fichier';
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            text-align: center;
            line-height: 30px;
            color: #fff;
            font-weight: bold;
        }
    </style>

</head>

<body>
    <h1 style="text-align: center; font-weight: bold; font-size: 24px; color: orange; margin-top: 10%;">Fiche de vœux
    </h1>

    <table border="1" style="margin: 0 auto;" id="TableExt">
        <tr>
            <td>
                <form action="reponse.php" method="post">
                    <table id="TableInt">
                        <tr>
                            <td class="cellule1">Nom</td>
                            <td class="cellule2">:</td>
                            <td class="cellule3"><input type="text" name="nom"> </td>
                        </tr>
                        <tr>
                            <td class="cellule1">Prénom</td>
                            <td class="cellule2">:</td>
                            <td class="cellule3"><input type="text" name="prenom"></td>
                        </tr>
                        <tr>
                            <td class="cellule1">Date de naissance</td>
                            <td class="cellule2">:</td>
                            <td class="cellule3"><input type="date" name="date_naissance"></td>
                        </tr>
                        <tr>
                            <td class="cellule1">N° de téléphone</td>
                            <td class="cellule2">:</td>
                            <td class="cellule3"><input type="number" name="telephone"></td>
                        </tr>
                        <tr>
                            <td class="cellule1">Adresse</td>
                            <td class="cellule2">:</td>
                            <td class="cellule3"><textarea name="adresse"></textarea></td>
                        </tr>
                        <tr>
                            <td class="cellule1">Genre</td>
                            <td class="cellule2">:</td>
                            <td class="cellule3">
                                <input type="radio" name="genre" value="Masculin"> Masculin
                                <input type="radio" name="genre" value="Féminin"> Féminin
                            </td>
                        </tr>
                        <tr>
                            <td class="cellule1">Civilité</td>
                            <td class="cellule2">:</td>
                            <td class="cellule3">
                                <input type="radio" name="civilite" value="Marié"> Marié
                                <input type="radio" name="civilite" value="Célibataire" checked> Célibataire
                            </td>
                        </tr>
                        <tr>
                            <td class="cellule1">Domaine</td>
                            <td class="cellule2">:</td>
                            <td class="cellule3">
                                <select name="domaine">
                                    <option value="">-- Choisissez --</option>
                                    <option value="1">INFORMATIQUE</option>
                                    <option value="2">MEDECINE</option>
                                    <option value="3">SCIENCES JURIDIQUES</option>
                                    <option value="4">GÉNIE CIVIL</option>
                                    <option value="5">Électronique</option>
                                </select>
                            </td>
                        </tr>
                        <tr>
                            <td class="cellule1">Languages desired</td>
                            <td class="cellule2">:</td>
                            <td class="cellule3">
                                <input type="checkbox" name="langues[]" value="French" checked> French
                                <input type="checkbox" name="langues[]" value="English"> English
                                <input type="checkbox" name="langues[]" value="Arabic"> Arabic
                                <input type="checkbox" name="langues[]" value="Aucun"> Aucun
                            </td>
                        </tr>
                        <tr>
                            <td class="cellule1">Lettre de motivation</td>
                            <td class="cellule2">:</td>
                            <td class="cellule3">
                                <div class="container">
                                    <input id="file-input" type="file" name="cover_letter">
                                    <label for="file-input" class="lbl"><i class="upl"></i>Choisir un fichier</label>
                                </div>
                            </td>
                        </tr>
                        <tr id="fusionnée">
                            <td colspan="3" style="text-align: center;">
                                <input type="submit" value="Sauvegarder">
                                <input type="reset" value="Annuler">
                            </td>
                        </tr>
                    </table>
                </form>
            </td>
        </tr>
    </table>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            var aucunCheckbox = document.querySelector('input[value="Aucun"]');
            var autresLanguesCheckboxes = document.querySelectorAll('input[name="langues[]"]:not([value="Aucun"])');

            aucunCheckbox.addEventListener('change', function () {
                if (this.checked) {
                    // Si "Aucun" est coché, désactiver les autres cases à cocher
                    autresLanguesCheckboxes.forEach(function (checkbox) {
                        checkbox.checked = false;
                        checkbox.disabled = true;
                    });
                } else {
                    // Si "Aucun" est décoché, activer les autres cases à cocher
                    autresLanguesCheckboxes.forEach(function (checkbox) {
                        checkbox.disabled = false;
                    });
                }
            });

            // Désactiver les autres cases à cocher si "Aucun" est coché initialement
            if (aucunCheckbox.checked) {
                autresLanguesCheckboxes.forEach(function (checkbox) {
                    checkbox.disabled = true;
                });
            }
        });
    </script>

</html>
